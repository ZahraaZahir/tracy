services:
  postgres:
    image: postgres:15-alpine
    container_name: tracy-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - tracy_db_data:/var/lib/postgresql/data
    networks:
      - tracy-net

  api:
    build: .
    container_name: tracy-api
    ports:
      - '3050:3050'
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      PORT: 3050
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - tracy-net

volumes:
  tracy_db_data:

networks:
  tracy-net:
    external: true
